<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VR360°Panorama</title>
    <meta name="description" content="An interactive panorama viewer." />
    <meta property="og:title" content="VR360°Panorama" />
    <meta property="og:description" content="An interactive panorama viewer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="text/javascript">
      // GitHub Pages trailing slash fixer:
      // When visiting https://username.github.io/repo, the browser considers 'repo' a file.
      // Relative assets (./assets/...) then fail with 404 by requesting https://username.github.io/assets/...
      // Redirecting to /repo/ ensures relative assets load correctly.
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-neutral-950 text-white m-0 p-0 overflow-hidden select-none">
    <div id="root">
      <!-- Instant preloader: Replaced automatically when React mounts. Prevents blank white screen on slow connections or subpaths -->
      <div id="pre-react-loader" style="position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f8fafc;z-index:99999;">
        <div style="width:44px;height:44px;border:3px solid rgba(56,189,248,0.2);border-top-color:#38bdf8;border-radius:50%;animation:panoSpin 0.8s linear infinite;margin-bottom:16px;"></div>
        <div style="font-size:15px;font-weight:600;letter-spacing:-0.01em;">VR 360° Virtual Tour</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:6px;">Loading 3D scene &amp; assets...</div>
        <div id="init-error-msg" style="display:none;margin-top:16px;max-width:360px;padding:12px 16px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);border-radius:10px;font-size:12px;color:#fca5a5;text-align:center;line-height:1.5;"></div>
        <style>
          @keyframes panoSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script>
      // Asset loading error fallback
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('pre-react-loader');
        var errBox = document.getElementById('init-error-msg');
        if (loader && errBox) {
          errBox.style.display = 'block';
          errBox.textContent = 'Resource failed to load: ' + (e.message || (e.target && e.target.src ? e.target.src : 'Please verify repository path and network.'));
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
