<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>VR360°Panorama - Redirecting</title>
    <script>
      // Clean redirect to repo root preserving room parameters and hash
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);
      // For GitHub Pages project repos: username.github.io/repo-name/
      // The first segment is the repo name
      var repoName = segments.length > 0 && window.location.hostname.endsWith('github.io') ? '/' + segments[0] + '/' : '/';
      var target = window.location.origin + repoName + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body style="background:#0a0a0a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to 360° Tour...</p>
  </body>
</html>
